<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل المبيعات والأقساط</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Ctext y='.9em' font-size='9'%3E💰%3C/text%3E%3C/svg%3E">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f7fa;--card:#fff;--tx:#1b2430;--mu:#5f6b7a;--bd:#d9dee5;--pri:#1f4e78;--paid:#87ceeb;--paidt:#0b3c5d;--late:#ffc7ce;--latet:#9c0006;--soon:#fff2cc;--ok:#c6efce;--okt:#006100}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12171d;--card:#1b222b;--tx:#e8edf3;--mu:#9aa6b4;--bd:#2d3744;--pri:#4a8bc2;--soon:#5c4a12;--late:#6b2230;--latet:#ffd0d6;--ok:#1f4d2b;--okt:#bdf0c9;--paid:#2a6f95;--paidt:#e3f4ff}}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px}
.wrap{max-width:1250px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:14px 0 6px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px;margin-bottom:12px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.box small{color:var(--mu);display:block;font-size:12px}.box b{font-size:17px}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
input,button,select{font:inherit;color:inherit}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:0;width:100%}
.bar input{flex:1;min-width:150px;width:auto}.bar select{width:auto}
button,.btn{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-block}
button.p{background:var(--pri);border-color:var(--pri);color:#fff}button.d{color:var(--latet)}
button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.cust{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.nm{font-weight:700;color:var(--pri);cursor:pointer;background:none;border:0;padding:0;font-size:15px;text-align:start}
.chip{border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.متأخر{background:var(--late);color:var(--latet)}.chip.منتظم{background:var(--ok);color:var(--okt)}.chip.مكتمل{background:var(--paid);color:var(--paidt)}
.sq{display:flex;flex-wrap:wrap;gap:3px}
.sq button{width:24px;height:24px;padding:0;border:0;border-radius:4px;font-size:11px;font-weight:700}
.sq .paid{background:var(--paid);color:var(--paidt)}.sq .late{background:var(--late)}.sq .soon{background:var(--soon)}
.ft{display:flex;gap:14px;font-size:13px;color:var(--mu);flex-wrap:wrap;margin-top:8px}.ft b{color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:10px 0}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:2px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{border-bottom:1px solid var(--bd);padding:7px 8px;text-align:center;font-size:13px}
th{background:var(--pri);color:#fff;position:sticky;top:0;white-space:nowrap}
td.l{text-align:start}tr.late td{background:var(--late)}td.paid{background:var(--paid);color:var(--paidt);font-weight:700}
.t td .sq{min-width:150px;max-width:340px}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(420px,94vw)}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.lg{font-size:12px;color:var(--mu);display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-inline-end:4px}
.pg{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.pg i{display:block;height:100%;background:var(--paid)}
.today{background:var(--card);border:1px solid var(--bd);border-right:4px solid var(--latet);border-radius:10px;padding:10px;margin-bottom:12px}
.tr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.tr:first-of-type{border-top:0}.tr a{padding:4px 10px;font-size:13px;color:var(--pri)}
.note{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--bd);font-size:13px}
.mb{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;min-width:100px}.mb i{display:block;height:100%;background:var(--paid)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<dialog id="dlg">
<h2>عميل جديد</h2>
<div class="grid" style="grid-template-columns:1fr 1fr">
<div style="grid-column:1/3"><label>اسم العميل</label><input id="f_name"></div>
<div><label>تاريخ البيع</label><input id="f_date" type="date"></div>
<div><label>المبلغ</label><input id="f_amount" type="number" inputmode="decimal"></div>
<div><label>عدد الأقساط</label><input id="f_n" type="number" min="1" max="120" inputmode="numeric"></div>
<div><label>رقم الهاتف</label><input id="f_phone" inputmode="tel"></div>
<div><label>المنتج</label><input id="f_product"></div>
<div><label>العنوان</label><input id="f_addr"></div>
</div>
<div class="bar" style="margin:0"><button class="p" id="f_ok">حفظ</button><button id="f_no">إلغاء</button></div>
</dialog>
<script>
const $=s=>document.querySelector(s);
let L=[],cur=null,q='',flt='all',srt='name',tab='list',store=null,wide=innerWidth>=760;
const today=()=>new Date().toISOString().slice(0,10);
const fd=d=>d?d.split('-').reverse().join('/'):'';
const rd=n=>Math.round(n*100)/100;
const fm=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const dd=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function addM(d,k){const[y,m,x]=d.split('-').map(Number);const t=new Date(Date.UTC(y,m-1+k,1));
 const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(x,last));return t.toISOString().slice(0,10)}
function amt(c,i){const b=rd(c.amount/c.n);return i===c.n?rd(c.amount-b*(c.n-1)):b}
function calc(c){let paid=0,late=0,cnt=0,lateAmt=0,first=null,firstAmt=0,oldest=null;const t=today();
 for(let i=1;i<=c.n;i++){const due=addM(c.date,i),a=amt(c,i);
  if(c.paid&&c.paid[i]){paid+=a;cnt++}else{if(!first){first=due;firstAmt=a}if(due<t){late++;lateAmt+=a;oldest=oldest||due}}}
 const rem=rd(c.amount-paid),lateDays=oldest?dd(t,oldest):0,left=first?dd(first,t):999;
 return{paid:rd(paid),rem,late,cnt,lateAmt:rd(lateAmt),first,firstAmt,lateDays,left,st:rem<=0?'مكتمل':late?'متأخر':'منتظم'}}
function persist(c,del){
 if(store){const r=store.doc(c.id);(del?r.delete():r.set(c)).catch(()=>{})}
 else try{localStorage.setItem('inst',JSON.stringify(L))}catch(e){}}
function save(c){const i=L.findIndex(x=>x.id===c.id);i<0?L.push(c):L[i]=c;persist(c);render()}
function remove(c){L=L.filter(x=>x.id!==c.id);persist(c,true);cur=null;render()}
function setPaid(c,i,d){c.paid=c.paid||{};d?c.paid[i]=d:delete c.paid[i];save(c)}
const wa=p=>{p=String(p||'').replace(/\D/g,'');return p.startsWith('0')?'20'+p.slice(1):p};

function sqs(c){let h='';for(let i=1;i<=c.n;i++){const due=addM(c.date,i),p=c.paid&&c.paid[i];
 h+=`<button class="${p?'paid':due<today()?'late':'soon'}" data-sq="${c.id}|${i}" title="${i} - ${fd(due)}">${p?'✔':''}</button>`}return h}

function dash(all){const t=today(),ym=t.slice(0,7);let s=0,p=0,la=0,ln=0,mo=0;
 all.forEach(({c,k})=>{s+=c.amount;p+=k.paid;la+=k.lateAmt;ln+=k.late;
  for(let i=1;i<=c.n;i++)if(!(c.paid&&c.paid[i])&&addM(c.date,i).slice(0,7)===ym)mo+=amt(c,i)});
 const call=all.filter(({k})=>k.rem>0&&(k.late>0||k.left<=3)).sort((a,b)=>b.k.lateDays-a.k.lateDays).slice(0,6);
 return`<div class="sum">
 <div class="box"><small>العملاء</small><b>${all.length}</b></div>
 <div class="box"><small>إجمالي المبيعات</small><b>${fm(s)}</b></div>
 <div class="box"><small>المدفوع</small><b>${fm(p)}</b></div>
 <div class="box"><small>المتبقي</small><b>${fm(rd(s-p))}</b></div>
 <div class="box"><small>المتأخر (مبلغ)</small><b style="color:var(--latet)">${fm(rd(la))}</b><small>${ln} قسط</small></div>
 <div class="box"><small>مستحق هذا الشهر</small><b>${fm(rd(mo))}</b></div>
 <div class="box"><small>نسبة التحصيل</small><b>${s?(p/s*100).toFixed(1):0}%</b></div></div>
 ${call.length?`<div class="today"><b>📞 كلّم النهارده (${call.length})</b>${call.map(({c,k})=>`<div class="tr"><span><b>${esc(c.name)}</b> — ${k.late?`متأخر ${k.lateDays} يوم · ${fm(k.lateAmt)}`:`قسط ${fm(k.firstAmt)} ${k.left?'بعد '+k.left+' يوم':'النهارده'}`}</span>
 <span>${c.phone?`<a class="btn" href="tel:${esc(c.phone)}" target="_blank" rel="noopener">اتصال</a> <a class="btn" href="https://wa.me/${wa(c.phone)}" target="_blank" rel="noopener">واتساب</a>`:''} <button data-open="${c.id}">فتح</button></span></div>`).join('')}</div>`:''}`}

function listView(){
 let all=L.map(c=>({c,k:calc(c)}));const d=dash(all);
 let rows=all.filter(({c,k})=>(!q||(c.name+c.phone+c.product).includes(q))&&(flt==='all'||(flt==='late'&&k.late>0)||(flt==='week'&&k.rem>0&&k.left<=7&&!k.late)||(flt==='done'&&k.rem<=0)));
 rows.sort((a,b)=>srt==='rem'?b.k.rem-a.k.rem:srt==='late'?b.k.lateDays-a.k.lateDays:a.c.name.localeCompare(b.c.name,'ar'));
 const body=!rows.length?`<div class="empty">${L.length?'لا نتائج':'لا يوجد عملاء بعد.<br><br><button class="p" id="add2">+ أضف أول عميل</button> <button id="demo">إضافة بيانات تجريبية</button>'}</div>`
 :wide?`<div class="tw"><table class="t"><tr><th>العميل</th><th>المنتج</th><th>الهاتف</th><th>المبلغ</th><th>المدفوع</th><th>المتبقي</th><th>القادم</th><th>الحالة</th><th>الأقساط</th></tr>
 ${rows.map(({c,k})=>`<tr><td class="l"><button class="nm" data-open="${c.id}">${esc(c.name)}</button></td><td>${esc(c.product)}</td><td>${esc(c.phone)}</td><td>${fm(c.amount)}</td><td>${fm(k.paid)}</td><td><b>${fm(k.rem)}</b></td>
 <td>${k.rem>0&&k.first?fd(k.first):'—'}</td><td><span class="chip ${k.st}">${k.st}</span></td><td><div class="sq">${sqs(c)}</div></td></tr>`).join('')}</table></div>`
 :rows.map(({c,k})=>`<div class="cust"><div class="hd"><button class="nm" data-open="${c.id}">${esc(c.name)} ◂</button><span class="chip ${k.st}">${k.st}</span></div>
 <div class="sq">${sqs(c)}</div><div class="ft"><span>المتبقي: <b>${fm(k.rem)}</b></span><span>المدفوع: <b>${fm(k.paid)}</b></span><span>الأقساط: <b>${k.cnt}/${c.n}</b></span>${k.late?`<span>متأخر: <b>${k.late}</b></span>`:''}${k.rem>0&&k.first?`<span>القادم: <b>${fd(k.first)}</b></span>`:''}</div></div>`).join('');
 const fb=(v,t)=>`<button data-flt="${v}" class="${flt===v?'on':''}">${t}</button>`;
 return d+`<div class="bar"><input id="q" placeholder="بحث بالاسم أو الهاتف أو المنتج" value="${esc(q)}"><button class="p" id="add">+ عميل جديد</button><button id="exp">تصدير العملاء</button><button id="exp2">تصدير الأقساط</button><button id="bk">💾 نسخة احتياطية</button><button id="rs">استعادة</button><input id="rsf" type="file" accept=".json" hidden></div>
 <div class="bar">${fb('all','الكل')}${fb('late','متأخرين')}${fb('week','قسط خلال أسبوع')}${fb('done','مكتمل')}
 <select id="srt"><option value="name"${srt==='name'?' selected':''}>ترتيب: الاسم</option><option value="rem"${srt==='rem'?' selected':''}>الأكبر متبقي</option><option value="late"${srt==='late'?' selected':''}>الأقدم تأخيرًا</option></select></div>
 <div class="lg"><span><i style="background:var(--paid)"></i>مدفوع</span><span><i style="background:var(--late)"></i>متأخر</span><span><i style="background:var(--soon)"></i>لم يحن موعده</span><span>اضغط المربع لتسجيل السداد</span></div>`+body}

function reportView(){const m={};
 L.forEach(c=>{for(let i=1;i<=c.n;i++){const k=addM(c.date,i).slice(0,7);(m[k]=m[k]||{d:0,c:0}).d+=amt(c,i);
  const p=c.paid&&c.paid[i];if(p){const pk=p.slice(0,7);(m[pk]=m[pk]||{d:0,c:0}).c+=amt(c,i)}}});
 const ks=Object.keys(m).sort(),mx=Math.max(1,...ks.map(k=>Math.max(m[k].d,m[k].c)));
 return`<h2>التقرير الشهري</h2><div class="lg">المستحق = أقساط موعدها في الشهر · المحصّل = أقساط اتسددت فيه</div>
 ${ks.length?`<div class="tw"><table><tr><th>الشهر</th><th>المستحق</th><th>المحصّل</th><th>الفرق</th><th></th></tr>${ks.map(k=>`<tr><td>${k.split('-').reverse().join('/')}</td><td>${fm(rd(m[k].d))}</td><td>${fm(rd(m[k].c))}</td><td>${fm(rd(m[k].d-m[k].c))}</td><td><div class="mb"><i style="width:${m[k].c/mx*100}%"></i></div></td></tr>`).join('')}</table></div>`:'<div class="empty">لا بيانات</div>'}`}

function detailView(c){const k=calc(c),pc=Math.min(100,c.paid&&k.paid?k.paid/c.amount*100:0);
 let tr='';for(let i=1;i<=c.n;i++){const due=addM(c.date,i),p=c.paid&&c.paid[i],lt=!p&&due<today();
  tr+=`<tr class="${lt?'late':''}"><td>${i}</td><td>${fd(due)}</td><td>${fm(amt(c,i))}</td><td class="${p?'paid':''}">${p?'مدفوع':'غير مدفوع'}</td>
  <td>${p?`<input type="date" value="${p}" data-pd="${i}" style="width:140px">`:`<button data-pay="${i}">تسجيل سداد</button>`}</td><td>${p?Math.max(0,dd(p,due)):lt?dd(today(),due)+' (متأخر)':''}</td></tr>`}
 const ns=(c.notes||[]).slice().reverse().map((n,j)=>`<div class="note"><span>${fd(n.d)} — ${esc(n.t)}</span><button class="d" data-dn="${(c.notes.length-1-j)}">✕</button></div>`).join('');
 return`<div class="bar"><button id="back">▶ رجوع</button>${c.phone?`<a class="btn" href="tel:${esc(c.phone)}" target="_blank" rel="noopener">اتصال</a><a class="btn" href="https://wa.me/${wa(c.phone)}" target="_blank" rel="noopener">واتساب</a>`:''}<button class="d" id="del" style="margin-inline-start:auto">حذف العميل</button></div>
 <div class="hd"><h1 style="margin:0">${esc(c.name)}</h1><span class="chip ${k.st}">${k.st}</span></div>
 <div class="pg"><i style="width:${pc}%"></i></div><div class="ft"><span>تم سداد <b>${pc.toFixed(0)}%</b> — ${k.cnt} من ${c.n} قسط</span></div>
 <div class="sum" style="margin-top:10px"><div class="box"><small>المبلغ</small><b>${fm(c.amount)}</b></div><div class="box"><small>قيمة القسط</small><b>${fm(amt(c,1))}</b></div>
 <div class="box"><small>المدفوع</small><b>${fm(k.paid)}</b></div><div class="box"><small>المتبقي</small><b>${fm(k.rem)}</b></div>
 <div class="box"><small>المتأخر</small><b style="color:var(--latet)">${fm(k.lateAmt)}</b><small>${k.late} قسط</small></div></div>
 <div class="grid"><div><label>اسم العميل</label><input data-f="name" value="${esc(c.name)}"></div><div><label>تاريخ البيع</label><input data-f="date" type="date" value="${c.date}"></div>
 <div><label>رقم الهاتف</label><input data-f="phone" inputmode="tel" value="${esc(c.phone)}"></div><div><label>المنتج</label><input data-f="product" value="${esc(c.product)}"></div>
 <div style="grid-column:1/-1"><label>العنوان</label><input data-f="addr" value="${esc(c.addr)}"></div></div>
 <h2>كشف الحساب</h2><div class="tw"><table><tr><th>القسط</th><th>الاستحقاق</th><th>القيمة</th><th>الحالة</th><th>تاريخ السداد</th><th>أيام التأخير</th></tr>${tr}</table></div>
 <h2>ملاحظات ومتابعات</h2><div class="bar"><input id="nt" placeholder="مثال: اتصلت وقال هيدفع يوم الخميس"><button class="p" id="addn">إضافة</button></div>${ns||'<div class="empty">لا ملاحظات</div>'}`}

function render(){const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;
 const c=cur&&L.find(x=>x.id===cur);
 const tabs=c?'':`<div class="bar"><button data-tab="list" class="${tab==='list'?'on':''}">العملاء</button><button data-tab="rep" class="${tab==='rep'?'on':''}">تقرير شهري</button></div>`;
 $('#app').innerHTML=`<h1>💰 سجل المبيعات والأقساط</h1>`+(c?detailView(c):tabs+(tab==='rep'?reportView():listView()));
 if(id==='q'){const e=$('#q');e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}}

document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const D=t.dataset;
 if(D.sq){const[id,i]=D.sq.split('|'),c=L.find(x=>x.id===id);
  if(c.paid&&c.paid[i]){if(confirm('إلغاء سداد هذا القسط؟'))setPaid(c,i,null)}else setPaid(c,i,today())}
 else if(D.open){cur=D.open;render();scrollTo(0,0)}
 else if(D.pay)setPaid(L.find(x=>x.id===cur),D.pay,today())
 else if(D.flt){flt=D.flt;render()}else if(D.tab){tab=D.tab;render()}
 else if(D.dn){const c=L.find(x=>x.id===cur);c.notes.splice(+D.dn,1);save(c)}
 else if(t.id==='addn'){const v=$('#nt').value.trim();if(!v)return;const c=L.find(x=>x.id===cur);(c.notes=c.notes||[]).push({d:today(),t:v});save(c)}
 else if(t.id==='back'){cur=null;render()}
 else if(t.id==='del'){const c=L.find(x=>x.id===cur);if(confirm('حذف العميل '+c.name+' نهائيًا؟'))remove(c)}
 else if(t.id==='add'||t.id==='add2'){['name','amount','n','phone','product','addr'].forEach(k=>$('#f_'+k).value='');$('#f_date').value=today();$('#dlg').showModal()}
 else if(t.id==='f_no')$('#dlg').close()
 else if(t.id==='f_ok'){const n=+$('#f_n').value,am=+$('#f_amount').value,nm=$('#f_name').value.trim();
  if(!nm||!(am>0)||!(n>=1)||!$('#f_date').value){alert('اكتب الاسم والتاريخ والمبلغ وعدد الأقساط');return}
  save({id:'c'+Date.now().toString(36),name:nm,date:$('#f_date').value,amount:am,n:Math.round(n),phone:$('#f_phone').value,product:$('#f_product').value,addr:$('#f_addr').value,paid:{},notes:[]});$('#dlg').close()}
 else if(t.id==='demo'){[['أحمد محمد علي','2026-01-10',12000,6,'01012345678','ثلاجة','القاهرة - مدينة نصر'],['محمود حسن إبراهيم','2026-02-05',18500,10,'01123456789','غسالة + شاشة','الجيزة - فيصل'],['سارة عبد الله','2026-03-01',7500,5,'01234567890','موبايل','الإسكندرية - سموحة'],['خالد يوسف','2026-04-15',25000,12,'01098765432','لابتوب','المنصورة'],['منى سعيد','2026-05-20',9000,3,'01187654321','تكييف','طنطا']]
  .forEach((r,i)=>{const c={id:'d'+i,name:r[0],date:r[1],amount:r[2],n:r[3],phone:r[4],product:r[5],addr:r[6],paid:i<2?{1:addM(r[1],1)}:{},notes:[]};L.push(c);persist(c)});render()}
 else if(t.id==='exp')exportCsv('cust')
 else if(t.id==='exp2')exportCsv('inst')
 else if(t.id==='bk')backup()
 else if(t.id==='rs')$('#rsf').click()});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;render()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='rsf'){restore(t.files[0]);t.value='';return}
 if(t.id==='srt'){srt=t.value;render();return}
 const c=L.find(x=>x.id===cur);if(!c)return;
 if(t.dataset.f){if(t.dataset.f==='name'&&!t.value.trim())return;c[t.dataset.f]=t.value;save(c)}
 else if(t.dataset.pd)setPaid(c,t.dataset.pd,t.value||null)});
addEventListener('resize',()=>{const w=innerWidth>=760;if(w!==wide){wide=w;render()}});

async function exportCsv(kind){
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 let h,rows=[];const t=today();
 if(kind==='inst'){h=['العميل','الهاتف','المنتج','رقم القسط','تاريخ الاستحقاق','القيمة','الحالة','تاريخ السداد','أيام التأخير'];
  L.forEach(c=>{for(let i=1;i<=c.n;i++){const due=addM(c.date,i),p=c.paid&&c.paid[i];
   rows.push([c.name,c.phone,c.product,i,fd(due),amt(c,i),p?'مدفوع':due<t?'متأخر':'لم يحن',p?fd(p):'',p?Math.max(0,dd(p,due)):due<t?dd(t,due):''].map(q).join(','))}})}
 else{h=['الاسم','المنتج','الهاتف','العنوان','تاريخ البيع','المبلغ','قيمة القسط','عدد الأقساط','أقساط مدفوعة','أقساط متبقية','المدفوع','المتبقي','نسبة السداد %','أقساط متأخرة','مبلغ متأخر','أيام التأخير','القسط القادم','قيمة القسط القادم','الحالة','آخر ملاحظة'];
  rows=L.map(c=>{const k=calc(c),nt=(c.notes||[]).slice(-1)[0];return[c.name,c.product,c.phone,c.addr,fd(c.date),c.amount,amt(c,1),c.n,k.cnt,c.n-k.cnt,k.paid,k.rem,rd(k.paid/c.amount*100),k.late,k.lateAmt,k.lateDays,k.rem>0?fd(k.first):'',k.rem>0?k.firstAmt:'',k.st,nt?fd(nt.d)+' - '+nt.t:''].map(q).join(',')})}
 const data='\ufeff'+[h.map(q).join(','),...rows].join('\n');
 try{const d=await claude.use('downloads');if(d){await d.save({filename:kind==='inst'?'installments.csv':'customers.csv',data});return}}catch(e){if(e&&e.code==='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download=kind==='inst'?'installments.csv':'customers.csv';a.click()}

async function backup(){const data=JSON.stringify(L,null,1),fn='backup-'+today()+'.json';
 try{const d=await claude.use('downloads');if(d){await d.save({filename:fn,data});return}}catch(e){if(e&&e.code==='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fn;a.click()}
async function restore(f){if(!f)return;try{const a=JSON.parse(await f.text());
 if(!Array.isArray(a)||!a.every(c=>c&&c.id&&c.name&&c.date&&c.amount>0&&c.n>=1))throw 0;
 if(!confirm('استعادة '+a.length+' عميل؟ العملاء بنفس الرقم هيتحدثوا والباقي بيفضل زي ما هو.'))return;
 a.forEach(c=>{const i=L.findIndex(x=>x.id===c.id);i<0?L.push(c):L[i]=c;persist(c)});render()}catch(e){alert('الملف غير صالح')}}

render();
(async()=>{let t=setTimeout(()=>{if(!store)try{L=JSON.parse(localStorage.getItem('inst')||'[]');render()}catch(e){}},4000);
 try{const db=await claude.use('db');
  if(db){store=db.collection('customers');store.onSnapshot(s=>{clearTimeout(t);L=s.docs.map(d=>({...d.data(),id:d.id}));render()},()=>{store=null})}}catch(e){}
 if(!store){clearTimeout(t);try{L=JSON.parse(localStorage.getItem('inst')||'[]')}catch(e){}render()}})();
</script>
